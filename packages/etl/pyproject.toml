[project]
name = "nfl-games-etl"
version = "0.1.0"
description = "ETL ingestion and puzzle generation pipeline using nflverse datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
