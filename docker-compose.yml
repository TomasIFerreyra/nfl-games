version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nfl-games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nfl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfl_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nfl_games_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nfl_admin} -d ${POSTGRES_DB:-nfl_games_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nfl-network

  redis:
    image: redis:7-alpine
    container_name: nfl-games-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nfl-network

volumes:
  postgres_data:
    name: nfl_games_postgres_data
  redis_data:
    name: nfl_games_redis_data

networks:
  nfl-network:
    name: nfl-games-network
    driver: bridge
