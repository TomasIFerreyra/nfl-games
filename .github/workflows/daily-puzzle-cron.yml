name: Daily Puzzle Batch Generation
# Production Scheduled Batch Puzzle Generation Pipeline
# Runs daily at 23:00 UTC (1 hour prior to midnight UTC rollover)

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Number of days ahead to precompute"
        required: false
        default: "7"
      force:
        description: "Force overwrite of existing puzzles"
        type: boolean
        default: false

jobs:
  generate-puzzles:
    name: Generate Daily Mini-Game Puzzles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt click

      - name: Execute Batch Puzzle Generator
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          ENVIRONMENT: "production"
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          DAYS="${{ github.event.inputs.days_ahead || '7' }}"
          python packages/etl/cron_generate_puzzles.py --days-ahead $DAYS $FORCE_FLAG
