name: Daily Puzzle Generation Cron

on:
  schedule:
    # Runs daily at 07:00 UTC (03:00 AM EDT / 04:00 AM ART)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Number of future days to precompute (default: 7)'
        required: false
        default: '7'
      force:
        description: 'Force overwrite existing puzzles for these dates'
        type: boolean
        default: false

jobs:
  generate-puzzles:
    name: Precompute Daily Mini-Games (Grid, Connections, Top10, Weddle)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt click

      - name: Execute Daily Batch Generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENVIRONMENT: "production"
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          DAYS="${{ github.event.inputs.days_ahead || '7' }}"
          python packages/etl/cron_generate_puzzles.py --days-ahead $DAYS $FORCE_FLAG
